env:
  env_name: Go2
  num_envs: 64
  max_episode_length: 300
  reward_bias: 0.0
  control_steps: 1

  newton_env_cfg:
    obs_type: policy
    random_reset: false
    camera_tracking: false
    forward_reward_scale: 1.0
    upright_reward_scale: 0.05
    heading_reward_scale: 0.05
    alive_reward: 0.02
    yaw_rate_penalty_scale: 0.01
    termination_penalty: 2.0

rl:
  config:
    name: Go2PPO
    max_epochs: 200000
    horizon_length: 300
    normalize_input: true
    normalize_value: true
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: true
    gamma: 0.995
    tau: 0.95
    learning_rate: 0.0003
    lr_schedule: adaptive
    kl_threshold: 0.01
    score_to_win: 1000000
    save_best_after: 25
    save_frequency: 100
    torch_compile: false
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2
    minibatch_size: 64
    mini_epochs: 5
    critic_coef: 2
    clip_value: true
    seq_length: 8
    bounds_loss_coef: 0.0001

    player:
      determenistic: true
      games_num: 2
      num_actors: 1
      print_stats: true

  network:
    mlp:
      units: [256, 256]
      activation: elu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None
